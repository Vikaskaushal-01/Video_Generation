<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>AI Video Studio</title>
<style>
  :root {
    --bg: #0b0b10; --panel: #15151d; --panel2: #1d1d28; --line: #2a2a38;
    --text: #ececf3; --muted: #8b8ba0; --accent: #7c5cff; --accent2: #22d3ee; --danger: #ff5c7a;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; background: var(--bg); color: var(--text); }
  header { display: flex; align-items: center; gap: 10px; padding: 16px 24px; border-bottom: 1px solid var(--line); }
  .logo { width: 30px; height: 30px; border-radius: 8px; background: linear-gradient(135deg, var(--accent), var(--accent2)); display: grid; place-items: center; font-weight: 800; }
  header h1 { font-size: 18px; margin: 0; }
  .badge { margin-left: auto; font-size: 12px; color: var(--muted); border: 1px solid var(--line); padding: 4px 10px; border-radius: 999px; }
  main { max-width: 1100px; margin: 0 auto; padding: 24px 16px 220px; }
  .hero { text-align: center; padding: 40px 0 20px; }
  .hero h2 { font-size: clamp(26px, 5vw, 40px); margin: 0 0 8px; }
  .hero p { color: var(--muted); margin: 0; }
  .ideas { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 18px; }
  .ideas button { background: var(--panel); border: 1px solid var(--line); color: var(--muted); padding: 8px 12px; border-radius: 999px; cursor: pointer; font-size: 13px; }
  .ideas button:hover { color: var(--text); border-color: var(--accent); }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; margin-top: 24px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; display: flex; flex-direction: column; }
  .media { aspect-ratio: 16/9; background: #000; position: relative; display: grid; place-items: center; }
  .media.portrait { aspect-ratio: 9/16; max-height: 520px; }
  .media video { width: 100%; height: 100%; object-fit: contain; }
  .loading { text-align: center; color: var(--muted); font-size: 13px; width: 80%; }
  .bar { height: 6px; background: var(--panel2); border-radius: 99px; overflow: hidden; margin-top: 10px; }
  .bar > div { height: 100%; width: 0; background: linear-gradient(90deg, var(--accent), var(--accent2)); transition: width .6s; }
  .spinner { width: 34px; height: 34px; border: 3px solid var(--line); border-top-color: var(--accent); border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto 10px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .body { padding: 12px 14px; display: flex; flex-direction: column; gap: 10px; }
  .prompt { font-size: 14px; line-height: 1.4; }
  .meta { color: var(--muted); font-size: 12px; }
  .err { color: var(--danger); font-size: 13px; }
  .actions { display: flex; gap: 6px; flex-wrap: wrap; }
  .actions button, .actions a { background: var(--panel2); border: 1px solid var(--line); color: var(--text); padding: 6px 10px; border-radius: 8px; font-size: 12px; cursor: pointer; text-decoration: none; }
  .actions button:hover, .actions a:hover { border-color: var(--accent); }
  .actions .del:hover { border-color: var(--danger); color: var(--danger); }

  .composer { position: fixed; left: 0; right: 0; bottom: 0; padding: 12px 16px 18px; background: linear-gradient(transparent, var(--bg) 30%); }
  .box { max-width: 860px; margin: 0 auto; background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 12px; box-shadow: 0 10px 40px #0008; }
  .box.editing { border-color: var(--accent2); }
  .box.editing #opts, .box.editing .attach { display: none; }
  textarea { width: 100%; resize: none; border: none; outline: none; background: transparent; color: var(--text); font: inherit; font-size: 15px; min-height: 48px; max-height: 160px; }
  .row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  #opts { display: contents; }
  select, .attach { background: var(--panel2); color: var(--text); border: 1px solid var(--line); border-radius: 10px; padding: 7px 10px; font-size: 13px; cursor: pointer; }
  .attach input { display: none; }
  .thumb { display: none; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); }
  .thumb img { width: 36px; height: 36px; object-fit: cover; border-radius: 6px; }
  .thumb button { background: none; border: none; color: var(--muted); cursor: pointer; font-size: 16px; }
  .count { font-size: 11px; color: var(--muted); }
  .go { margin-left: auto; background: linear-gradient(135deg, var(--accent), #5b8cff); color: #fff; border: none; border-radius: 12px; padding: 10px 18px; font-weight: 600; cursor: pointer; font-size: 14px; }
  .go:disabled { opacity: .5; cursor: not-allowed; }
  .toast { position: fixed; top: 16px; left: 50%; transform: translateX(-50%); background: var(--danger); color: #fff; padding: 10px 16px; border-radius: 10px; display: none; z-index: 10; max-width: 90vw; font-size: 14px; }
  @media (max-width: 600px) { .go { width: 100%; margin-left: 0; } }
</style>
</head>
<body>
<header><div class="logo">▶</div><h1>AI Video Studio</h1><span class="badge" id="badge"></span></header>

<main>
  <section class="hero" id="hero">
    <h2>What do you want to create?</h2>
    <p>Describe a scene, or upload an image, and AI turns it into a video.</p>
    <div class="ideas" id="ideas"></div>
  </section>
  <div class="grid" id="grid"></div>
</main>

<div class="composer">
  <div class="box" id="box">
    <textarea id="prompt" placeholder="A golden retriever surfing a huge wave at sunset, cinematic slow motion…"></textarea>
    <div class="row">
      <span id="opts"></span>
      <label class="attach" title="Start from an image">🖼 Image<input type="file" id="file" accept="image/png,image/jpeg" /></label>
      <span class="thumb" id="thumb"><img id="thumbImg" alt="" /><button id="clearImg" title="Remove">✕</button></span>
      <span class="count" id="count"></span>
      <button class="go" id="go">Generate</button>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
const $ = (id) => document.getElementById(id);
const IDEAS = [
  "A cozy cabin in a snowy forest, smoke rising from the chimney, camera slowly pushes in",
  "Neon-lit Tokyo street at night in the rain, reflections on wet pavement",
  "An astronaut riding a horse across Mars, epic wide shot",
  "Macro shot of a hummingbird drinking from a flower, slow motion",
  "A paper boat sailing down a stream in a magical glowing forest",
];
let config = { fields: [], promptLimit: 512 }, imageData = null;
const jobs = new Map();

function toast(msg) { const t = $("toast"); t.textContent = msg; t.style.display = "block"; clearTimeout(t._h); t._h = setTimeout(() => t.style.display = "none", 6000); }
function esc(s) { return String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }

$("ideas").innerHTML = IDEAS.map((i) => `<button>${esc(i)}</button>`).join("");
$("ideas").onclick = (e) => { if (e.target.tagName === "BUTTON") { $("prompt").value = e.target.textContent; updateCount(); $("prompt").focus(); } };

function updateCount() { const n = $("prompt").value.length; $("count").textContent = n > config.promptLimit * 0.7 ? `${n}/${config.promptLimit}` : ""; }
$("prompt").addEventListener("input", (e) => { e.target.style.height = "auto"; e.target.style.height = e.target.scrollHeight + "px"; updateCount(); });
$("prompt").addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); generate(); } });

$("file").onchange = (e) => {
  const f = e.target.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = () => { imageData = r.result; $("thumbImg").src = imageData; $("thumb").style.display = "inline-flex"; };
  r.readAsDataURL(f);
};
$("clearImg").onclick = () => { imageData = null; $("file").value = ""; $("thumb").style.display = "none"; };

// Keep uploads small (Vercel limits requests to ~4.5 MB)
function shrinkImage(dataUrl, max = 1280) {
  return new Promise((resolve) => {
    const img = new Image();
    img.onload = () => {
      const s = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement("canvas");
      c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      resolve(c.toDataURL("image/jpeg", 0.85));
    };
    img.src = dataUrl;
  });
}

async function api(url, opts = {}) {
  let r;
  try { r = await fetch(url, { headers: { "Content-Type": "application/json" }, ...opts }); }
  catch { throw new Error("Cannot reach the server — check your connection and try again."); }
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(data.error?.message || (r.status === 504 ? "The AI took too long — try a shorter video or try again." : `Request failed (${r.status})`));
  return data;
}

// History lives in this browser only (no database)
const STORE = "videos";
function saveHistory() {
  // Browser storage is ~5 MB; drop the oldest videos until the list fits
  let list = [...jobs.values()].filter((j) => j.status !== "failed").slice(0, 50);
  while (list.length) {
    try { localStorage.setItem(STORE, JSON.stringify(list)); return; } catch { list = list.slice(0, -1); }
  }
  try { localStorage.removeItem(STORE); } catch {}
}
function loadHistory() {
  try { return JSON.parse(localStorage.getItem(STORE) || "[]"); } catch { return []; }
}

function currentOptions() {
  const o = {};
  config.fields.forEach((f) => (o[f.name] = $("opt-" + f.name).value));
  return o;
}

async function generate() {
  const prompt = $("prompt").value.trim();
  if (!prompt && !imageData) return toast("Please describe the video you want.");
  if (prompt.length > config.promptLimit) return toast(`Prompt is too long (max ${config.promptLimit} characters).`);
  const body = { prompt, options: currentOptions() };
  if (imageData) body.image = await shrinkImage(imageData);
  const job = { id: crypto.randomUUID().slice(0, 12), prompt, options: body.options, fromImage: !!imageData, status: "processing", createdAt: Date.now() };
  upsert(job, true);
  $("prompt").value = ""; $("prompt").style.height = "auto"; updateCount(); $("clearImg").click();
  try {
    const r = await api("/api/videos", { method: "POST", body: JSON.stringify(body) });
    finish(job, r);
  } catch (e) { finish(job, { status: "failed", error: e.message }); }
}
$("go").onclick = generate;

function finish(job, r) {
  Object.assign(job, r, r.status === "completed" && { finishedAt: Date.now() });
  upsert(job); saveHistory();
  if (job.status === "processing" && job.taskId) poll(job);
}

async function poll(job) {
  while (job.status === "processing") {
    await new Promise((r) => setTimeout(r, 5000));
    try { finish(job, await api(`/api/videos/${encodeURIComponent(job.taskId)}`)); }
    catch (e) { if (!/reach the server/.test(e.message)) finish(job, { status: "failed", error: e.message }); }
  }
}

function labelFor(name, value) {
  const f = config.fields.find((f) => f.name === name);
  return f?.options.find(([v]) => v === value)?.[1].replace(/^[^\w\d]+\s*/u, "") || value;
}

function render(v) {
  let media;
  if (v.status === "completed") {
    media = `<video src="${esc(v.videoUrl)}#t=0.1" controls loop playsinline preload="metadata" onerror="this.outerHTML='<div class=&quot;loading err&quot;>This video has expired on the AI service.<br>Use “Reuse prompt” to make it again.</div>'"></video>`;
  } else if (v.status === "failed") {
    media = `<div class="loading err">⚠ Generation failed<br>${esc(v.error || "")}</div>`;
  } else {
    const secs = Math.floor((Date.now() - v.createdAt) / 1000);
    const est = Math.min(95, Math.round(secs / 1.8));
    media = `<div class="loading"><div class="spinner"></div>Creating your video… ${Math.floor(secs / 60)}:${String(secs % 60).padStart(2, "0")}<div class="bar"><div style="width:${est}%"></div></div><div style="margin-top:8px">Usually takes 30 seconds to a few minutes. Keep this tab open.</div></div>`;
  }
  const opts = Object.entries(v.options || {}).map(([k, val]) => labelFor(k, val));
  const tags = [v.model, ...opts, v.fromImage && "from image"].filter(Boolean).join(" · ");
  return `
    <div class="media ${v.portrait ? "portrait" : ""}">${media}</div>
    <div class="body">
      <div class="prompt">${esc(v.prompt) || "<i>(image only)</i>"}</div>
      <div class="meta">${esc(tags)} · ${new Date(v.createdAt).toLocaleString()}</div>
      <div class="actions">
        ${v.status === "completed" ? `<a href="${esc(v.videoUrl)}" target="_blank" rel="noopener" download="video-${v.id}.mp4">⬇ Download</a>` : ""}
        ${v.prompt ? `<button data-copy="${esc(v.prompt)}">📋 Reuse prompt</button>` : ""}
        ${v.status !== "processing" ? `<button class="del" data-del="${v.id}">🗑 Remove</button>` : ""}
      </div>
    </div>`;
}

function upsert(v, prepend = false) {
  let el = document.querySelector(`[data-id="${v.id}"]`);
  if (el && el.dataset.status === "completed" && v.status === "completed") return; // keep video playing
  jobs.set(v.id, v);
  if (!el) {
    el = document.createElement("div"); el.className = "card"; el.dataset.id = v.id;
    prepend ? $("grid").prepend(el) : $("grid").append(el);
  }
  el.dataset.status = v.status;
  el.innerHTML = render(v);
  $("hero").style.paddingTop = jobs.size ? "10px" : "40px";
}
// Refresh the timer on cards that are still generating
setInterval(() => jobs.forEach((j) => { if (j.status === "processing") upsert(j); }), 1000);

$("grid").onclick = (e) => {
  const b = e.target.closest("button"); if (!b) return;
  if (b.dataset.copy !== undefined) { $("prompt").value = b.dataset.copy; updateCount(); $("prompt").focus(); }
  if (b.dataset.del) { document.querySelector(`[data-id="${b.dataset.del}"]`)?.remove(); jobs.delete(b.dataset.del); saveHistory(); }
};

(async () => {
  try {
    config = await api("/api/config");
    $("badge").textContent = config.label;
    if (config.setupError) {
      $("hero").insertAdjacentHTML("beforeend", `<p class="err" style="margin-top:16px;border:1px solid var(--danger);padding:12px;border-radius:10px">⚠ ${esc(config.setupError)}</p>`);
    }
    $("opts").innerHTML = config.fields.map((f) =>
      `<select id="opt-${f.name}" title="${esc(f.label)}">${f.options.map(([v, l]) => `<option value="${esc(v)}" ${v === f.default ? "selected" : ""}>${esc(l)}</option>`).join("")}</select>`
    ).join("");
  } catch (e) { toast(e.message); }
  // Restore history; HF jobs interrupted by closing the tab can't be resumed
  loadHistory().reverse().forEach((v) => {
    if (v.status === "processing" && !v.taskId) Object.assign(v, { status: "failed", error: "The tab was closed before the video finished." });
    upsert(v, true);
    if (v.status === "processing") poll(v);
  });
})();
</script>
</body>
</html>
